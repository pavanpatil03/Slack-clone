<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Sales | Slack</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="request.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <nav>
        <div class="imgHeader">
          <div class="img">
            <img src="image.png" alt="logo" />
          </div>

          <div class="textHeader">
            <a href="#" class="headerText">features</a>
            <a href="#" class="headerText">Solutions</a>
            <a href="#" class="headerText">Enterprise</a>
            <a href="#" class="headerText">Resources</a>
            <a href="#" class="headerText">Pricing</a>
          </div>
        </div>
        <div class="itemHeader">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span class="small">sign&nbsp;in</span>
          <button class="btn" id="salesButton">Talk To sales</button>
          <button class="btn" id="startButton">Get Started</button>
          <i class="fa-solid fa-list"></i>
        </div>
      </nav>
    </header>

    <!-- MAIN SECTION -->
    <main class="container">
      <div class="card">
        <h1>Contact our sales team</h1>
        <p class="subtitle">
          Schedule a demo, get pricing details and explore use cases. We’re
          standing by to answer any questions.
        </p>

        <form class="form">
          <div class="form-row">
            <div class="form-group">
              <label>Work email address <span>*</span></label>
              <input type="email" placeholder="Your email address" />
            </div>

            <div class="form-group">
              <label>Phone number <span>*</span></label>
              <input type="text" placeholder="(555) 555-5555" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Country/Region <span>*</span></label>
              <select>
                <option>India</option>
                <option>United States</option>
                <option>United Kingdom</option>
              </select>
            </div>

            <div class="form-group">
              <label>Role <span>*</span></label>
              <select>
                <option>Please select one</option>
                <option>Developer</option>
                <option>Manager</option>
                <option>Student</option>
              </select>
            </div>
          </div>

          <p class="privacy">
            We value your privacy. To learn more, visit our
            <a href="#">privacy statement</a>.
          </p>
        </form>
      </div>
    </main>
    <script>
      let logo = document.querySelector(".img");
      logo.addEventListener("click", () => {
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
